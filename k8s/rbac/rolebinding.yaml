apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-operator
  namespace: resilience-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-operator-binding
  namespace: resilience-lab
subjects:
  - kind: ServiceAccount
    name: chaos-operator
    namespace: resilience-lab
roleRef:
  kind: Role
  name: chaos-operator
  apiGroup: rbac.authorization.k8s.io
