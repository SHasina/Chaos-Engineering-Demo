apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-resilience
  namespace: resilience-lab
data:
  resilience-lab.json: |
    {
      "title": "Resilience Lab",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request rate by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx) by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total{http_status=~\"5..\"}[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 latency by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Availability (non-5xx share, 5m)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "1 - (sum(rate(http_requests_total{http_status=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m])))"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit" }
          }
        }
      ]
    }
